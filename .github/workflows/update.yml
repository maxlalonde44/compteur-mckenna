name: Mise a jour du compteur

on:
  schedule:
    - cron: "17 * * * *"      # chaque heure, a la 17e minute
  workflow_dispatch:           # bouton « Run workflow » pour lancer a la main

permissions:
  contents: write

concurrency:
  group: compteur
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aller chercher les stats de la LNH
        run: node update.mjs

      - name: Sauvegarder data.json (Netlify remet le site a jour tout seul)
        run: |
          if ! git diff --quiet data.json; then
            git config user.name "compteur-bot"
            git config user.email "compteur-bot@users.noreply.github.com"
            git add data.json
            git commit -m "Mise a jour des stats"
            git push
          fi
